x-airflow-common:
  &airflow-common

  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.6.0}

  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://@redis:6379/0

    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

  volumes:
    - ./Airflow/dags:/opt/airflow/dags
    - ./Airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs

  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy


services:

  # =========================================================
  # POSTGRESQL
  # =========================================================
  postgres:
    image: postgres:13

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  # =========================================================
  # REDIS
  # =========================================================
  redis:
    image: redis:latest

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s


  # =========================================================
  # AIRFLOW WEBSERVER
  # =========================================================
  airflow-webserver:
    <<: *airflow-common

    command: webserver

    ports:
      - "0.0.0.0:8030:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # =========================================================
  # AIRFLOW SCHEDULER
  # =========================================================
  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # =========================================================
  # AIRFLOW WORKER
  # =========================================================
  airflow-worker:
    <<: *airflow-common

    command: celery worker

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # =========================================================
  # AIRFLOW INIT
  # =========================================================
  airflow-init:
    <<: *airflow-common

    command: version

    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://@redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  # =========================================================
  # MINIO AIStor
  # =========================================================
  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-08-07T18-34-35Z

    ports:
      - "0.0.0.0:8002:9000"
      - "0.0.0.0:8001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    command:
      - server
      - /data
      - --console-address
      - ":9001"
      - --license
      - /minio.license

    volumes:
      - minio_data:/data
      - ./minio.license:/minio.license:ro

    restart: unless-stopped


  # =========================================================
  # JUPYTER
  # =========================================================
  jupyter:
    build:
      context: ./Jupyter
      dockerfile: Dockerfile.jupyter

    ports:
      - "0.0.0.0:8025:8025"

    volumes:
      - ./Jupyter:/app

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started


  # =========================================================
  # INFERENCE API
  # =========================================================
  inference_api:
    build:
      context: ./Inference_API
      dockerfile: Dockerfile.api

    ports:
      - "0.0.0.0:8010:8010"

    environment:
      MINIO_URL: http://minio:9000
      MINIO_USER: admin
      MINIO_PASSWORD: password123

    depends_on:
      minio:
        condition: service_started


# =========================================================
# VOLUMES
# =========================================================
volumes:
  airflow_logs:
  postgres-db-volume:
  minio_data: